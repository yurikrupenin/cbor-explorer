name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install 'cross' if the matrix job requires cross-compilation
      - name: Install Cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Build the binary
      # We dynamically select between 'cargo' and 'cross' based on the matrix
      - name: Build
        run: |
          command="cargo"
          if [[ "${{ matrix.cross }}" == "true" ]]; then command="cross"; fi
          $command build --release --locked --target ${{ matrix.target }}

      # Create a tarball/zip of the binary + README/License
      - name: Package Artifacts
        shell: bash
        run: |
          # Define output name
          name="cbx-${{ matrix.target }}"
          mkdir "$name"
          
          # Copy binary (handle Windows extension dynamically)
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/cbx.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/cbx" "$name/"
          fi
          
          cp README.md LICENSE "$name/"
          
          # Compress
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name"
          else
            tar -czvf "$name.tar.gz" "$name"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip

  package-deb:
    name: Package Debian (.deb)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deb
        run: cargo install cargo-deb
      
      - name: Build and Package
        run: |
          # Build x86_64 deb
          cargo deb --target x86_64-unknown-linux-gnu --output cbx_amd64.deb
          
      - name: Upload.deb to Release
        uses: softprops/action-gh-release@v1
        with:
          files: *.deb

  package-snap:
    name: Package Snap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Snap
        uses: snapcore/action-build@v1
        id: snap-build
        
