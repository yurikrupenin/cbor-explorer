name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install 'cross' if the matrix job requires cross-compilation
      - name: Install Cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          command="cargo"
          if [[ "${{ matrix.cross }}" == "true" ]]; then command="cross"; fi
          $command build --release --locked --target ${{ matrix.target }}

      - name: Package Artifacts
        shell: bash
        run: |
          # Define output name
          name="cbx-${{ matrix.target }}"
          mkdir "$name"
          
          # Copy binary (handle Windows extension dynamically)
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/cbx.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/cbx" "$name/"
          fi
          
          cp README.md LICENSE "$name/"
          
          # Compress
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name"
          else
            tar -czvf "$name.tar.gz" "$name"
          fi

      - name: Package Debian (.deb)
        if: contains(matrix.target, 'linux')
        run: |
          cargo install cargo-deb
          
          # For aarch64, we need binutils for the target so cargo-deb can analyze the binary
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
             sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
          fi
          
          # --no-build tells cargo-deb to use the existing artifact from the 'Build' step
          # --target is key so it finds the binary in target/<triple>/release
          cargo deb --no-build --target ${{ matrix.target }} --output "cbx_${{ matrix.target }}.deb"

      - name: Prepare Snap Metadata
        if: contains(matrix.target, 'linux')
        shell: bash
        env:
          SNAP_TARGET_ARCH: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'arm64' || 'amd64' }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Prepare snap build directory
          mkdir -p snap_build
          
          # Copy binary
          cp "target/${{ matrix.target }}/release/cbx" snap_build/
          
          # Generate snapcraft.yaml
          cat <<EOF > snap_build/snapcraft.yaml
          name: cbx
          base: core22
          version: '${VERSION}'
          summary: A TUI application for inspecting CBOR data
          description: |
            A TUI application for inspecting CBOR (Concise Binary Object Representation) data.
            Cbx provides a tree-like view of the data structure, syntax highlighting, and
            heuristic detection options (scanning files for embedded CBOR data structures).
          confinement: strict
          grade: stable
          architectures:
            - build-on: amd64
              build-for: ${SNAP_TARGET_ARCH}
          
          apps:
            cbx:
              command: bin/cbx
              plugs: [home, removable-media]
          
          parts:
            cbx:
              # Use the binary we just copied
              plugin: dump
              source: .
              organize:
                cbx: bin/cbx
          EOF

      - name: Package Snap
        if: contains(matrix.target, 'linux')
        uses: snapcore/action-build@v1
        id: snap-build
        with:
          path: snap_build

      # - name: Publish Snap
      #   uses: snapcore/action-publish@v1
      #   env:
      #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
      #   with:
      #     snap: ${{ steps.snap-build.outputs.snap }}
      #     release: stable

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
            *.deb
            *.snap