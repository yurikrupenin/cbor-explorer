[package]
name = "cbor-explorer"
version = "0.1.0"
edition = "2021"
description = "A TUI application for exploring CBOR files"
license = "MIT"
authors = ["MiniMax Agent"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ciborium = "0.2"
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.1"
directories = "6.0.0"

[[bin]]
name = "cbor-explorer"
path = "src/main.rs"
