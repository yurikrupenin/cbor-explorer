[package]
name = "cbx"
version = "0.1.0"
edition = "2021"
description = "A TUI application for inspecting CBOR data"
license = "MIT"
authors = ["Yuri Krupenin <yuri.krupenin@gmail.com>"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ciborium = "0.2"
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.1"
directories = "6.0.0"
rand = "0.8"

[[bin]]
name = "cbx"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Yuri Krupenin <yuri.krupenin@gmail.com>"
copyright = "2026, Yuri Krupenin"
depends = "$auto"
section = "utility"

