[package]
name = "cbx"
version = "0.1.2"
edition = "2021"
description = "A TUI application for inspecting CBOR data"
license = "MIT"
authors = ["Yuri Krupenin <yuri.krupenin@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
ratatui = { version = "0.29", default-features = false }
ciborium = "0.2"
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.1"
directories = "6.0.0"
rand = "0.8"
bitflags = "2.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }


[[bin]]
name = "cbx"
path = "src/main.rs"

[[bin]]
name = "generate_large_embedded"
path = "src/utilities/generate_large_embedded.rs"

[package.metadata.deb]
maintainer = "Yuri Krupenin <yuri.krupenin@gmail.com>"
copyright = "2026, Yuri Krupenin"
depends = "$auto"
section = "utility"

#[profile.release]
#debug = true
